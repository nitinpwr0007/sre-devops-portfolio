# Week 2 observability stack — Day 1: logs → Loki.
#   app      — Flask service emitting ONE JSON log line per request (stdout)
#   loki     — log store, queried with LogQL
#   promtail — discovers containers via Docker API, ships stdout → Loki
#   grafana  — Explore view for LogQL (Loki datasource auto-provisioned)
#
# Ports are offset from Week 1 (app 8081, grafana 3001) so both stacks can run together.
services:
  app:
    build: ./app
    image: week2-demo:latest
    container_name: week2-demo
    ports:
      - "8081:8080"
    environment:
      FAIL_RATE: "${FAIL_RATE:-0}"
      LATENCY_MS: "${LATENCY_MS:-0}"
      # Day 3: export spans to the OTel Collector (SDK appends /v1/traces).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "week2-app"
    restart: unless-stopped
    depends_on: [otel-collector]
    networks: [obs]

  loki:
    image: grafana/loki:3.1.1
    container_name: week2-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [obs]

  mimir:
    image: grafana/mimir:2.13.0
    container_name: week2-mimir
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "9009:9009"
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    restart: unless-stopped
    networks: [obs]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: week2-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    depends_on: [mimir]
    networks: [obs]

  promtail:
    image: grafana/promtail:3.1.1
    container_name: week2-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on: [loki]
    networks: [obs]

  tempo:
    image: grafana/tempo:2.6.1
    container_name: week2-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks: [obs]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: week2-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel/config.yml:ro
    restart: unless-stopped
    depends_on: [tempo]
    networks: [obs]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: week2-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin      # lab only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # lab convenience: browse without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on: [loki]
    networks: [obs]

networks:
  obs:

volumes:
  loki-data:
  mimir-data:
  tempo-data:
  grafana-data:
