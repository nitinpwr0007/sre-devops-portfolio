# Tempo — single-binary, local filesystem storage (lab).
# Receives spans over OTLP from the OTel Collector, stores trace blocks locally,
# and serves Grafana's Tempo datasource on :3200.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m       # flush blocks quickly so traces are searchable fast

compactor:
  compaction:
    block_retention: 168h      # 7-day retention for the lab

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
