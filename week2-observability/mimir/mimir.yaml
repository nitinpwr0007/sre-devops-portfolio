# Mimir — monolithic (single-binary) mode for the lab, filesystem storage.
# Day 2: Prometheus remote_writes here; Grafana queries it via /prometheus.
# multitenancy is OFF for now (single tenant) — X-Scope-OrgID multi-tenancy is Day 6.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler

store_gateway:
  sharding_ring:
    replication_factor: 1

# Lab limits: allow fresh samples and a generous cardinality ceiling.
limits:
  compactor_blocks_retention_period: 7d
  max_global_exemplars_per_user: 100000     # enable exemplar storage (Day 4)
