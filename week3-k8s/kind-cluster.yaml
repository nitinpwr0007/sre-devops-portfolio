# kind cluster for Week 3 — 1 control-plane + 2 workers.
#
# Cluster anatomy this file creates:
#   control-plane node  -> runs the CONTROL PLANE (kube-apiserver, etcd,
#                          kube-scheduler, kube-controller-manager) as static
#                          pods, plus kubelet + kube-proxy + CNI like any node.
#   worker nodes (x2)    -> run the DATA PLANE only (kubelet, kube-proxy, CNI)
#                          and host our application Pods.
#
# extraPortMappings on the control-plane publish the host's :80/:443 into the
# node so the ingress-nginx controller (pinned to this node via the
# ingress-ready label + a nodeSelector/toleration) is reachable from the Mac at
# http://localhost. This is the kind-specific way to expose an Ingress locally.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: week3
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
