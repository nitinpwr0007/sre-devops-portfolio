# Secret = sensitive config. Kubernetes stores the values base64-encoded and
# treats them more carefully than a ConfigMap (RBAC, optional encryption at rest).
#
# WARNING: this token is a FAKE, throwaway lab value. NEVER commit real secrets
# to git. Real workflow (Week 5 D6): sealed-secrets / external-secrets so the
# git copy is encrypted or just a reference. Using stringData here so the value
# is human-readable; Kubernetes base64-encodes it on apply.
apiVersion: v1
kind: Secret
metadata:
  name: week3-app-secret
  labels:
    app: week3-app
type: Opaque
stringData:
  API_TOKEN: "lab-dummy-token-not-a-real-secret"
