# Deployment = desired state for a set of stateless Pods.
# Replica count is managed by the HorizontalPodAutoscaler (manifests/hpa.yaml),
# so replicas is intentionally omitted here to avoid fighting the HPA on apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week3-app
  labels:
    app: week3-app
spec:
  selector:
    matchLabels:
      app: week3-app
  template:
    metadata:
      labels:
        app: week3-app
    spec:
      # topologySpreadConstraints = the MODERN way to spread replicas evenly.
      # maxSkew:1 over hostname -> no node may hold more than 1 pod more than any
      # other. whenUnsatisfiable: ScheduleAnyway (soft) so a node drain can still
      # reschedule the evicted pod onto the one remaining worker (DoNotSchedule
      # would block it, since 2 pods on 1 node breaks maxSkew during a drain).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: week3-app
      affinity:
        # podAntiAffinity = the CLASSIC way to say "keep my replicas apart."
        # preferred (soft) so scheduling still succeeds when nodes are scarce;
        # `required` would be a hard rule that can leave pods Pending.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: week3-app
      containers:
        - name: app
          image: week3-app:day4
          # Image is loaded straight into the kind nodes with `kind load`, so
          # never pull from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Non-secret config (GREETING/RELEASE) pulled in as env vars.
          envFrom:
            - configMapRef:
                name: week3-app-config
          # Downward API -> the app reports which Pod/node served each request,
          # making Service load-balancing visible.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Secret value injected as a single env var (kept out of the image).
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: week3-app-secret
                  key: API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Liveness: restart the container if the process wedges.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          # Readiness: only add the Pod to the Service endpoints once it answers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
