# CHILD app (managed by the root app-of-apps). Syncs the encrypted SealedSecret
# in secrets/ into the week5 namespace. The sealed-secrets controller then
# decrypts it into a real Secret the app can consume. Only the ENCRYPTED blob
# ever lives in Git — safe even in a public repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secret-app
  namespace: argocd
  finalizers:
    # On delete/prune, cascade-delete the SealedSecret instead of orphaning it.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nitinpwr0007/sre-devops-portfolio.git
    targetRevision: main
    path: week5-cicd-gitops/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: week5 # same namespace as week5-app, so it can mount the Secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
