# CHILD app (managed by the root). Same week5-app from D2, now owned by app-of-apps
# instead of a manual kubectl apply. The root creates/updates this Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: week5-app
  namespace: argocd
  finalizers:
    # On delete/prune, cascade-delete this app's workload instead of orphaning it.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nitinpwr0007/sre-devops-portfolio.git
    targetRevision: main
    path: week5-cicd-gitops/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: week5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
