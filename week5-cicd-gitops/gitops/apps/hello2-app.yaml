# CHILD app #3, added to demo onboarding. The root already watches gitops/apps/,
# so committing this file is all it takes for ArgoCD to create the whole app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello2-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nitinpwr0007/sre-devops-portfolio.git
    targetRevision: main
    path: week5-cicd-gitops/hello2
  destination:
    server: https://kubernetes.default.svc
    namespace: hello2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
