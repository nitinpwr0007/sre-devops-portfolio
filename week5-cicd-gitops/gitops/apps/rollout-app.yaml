# CHILD app for the Argo Rollouts canary demo, managed by the app-of-apps root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollout-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nitinpwr0007/sre-devops-portfolio.git
    targetRevision: main
    path: week5-cicd-gitops/rollout
  destination:
    server: https://kubernetes.default.svc
    namespace: rollout
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
