# The desired state ArgoCD keeps the cluster matched to. Change this file in Git,
# push, and ArgoCD reconciles the cluster to match — that is GitOps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week5-app
  labels:
    app: week5-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week5-app
  template:
    metadata:
      labels:
        app: week5-app
    spec:
      containers:
        - name: week5-app
          image: ghcr.io/nitinpwr0007/sre-devops-portfolio/week5-app:latest
          imagePullPolicy: Always # :latest is mutable, so always re-pull
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
