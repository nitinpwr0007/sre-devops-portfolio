# The desired state ArgoCD keeps the cluster matched to. Change this file in Git,
# push, and ArgoCD reconciles the cluster to match — that is GitOps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week5-app
  labels:
    app: week5-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: week5-app
  template:
    metadata:
      labels:
        app: week5-app
    spec:
      containers:
        - name: week5-app
          image: ghcr.io/nitinpwr0007/sre-devops-portfolio/week5-app:latest
          imagePullPolicy: Always # :latest is mutable, so always re-pull
          ports:
            - containerPort: 8080
          # Inject every key of the decrypted Secret as an env var (API_KEY).
          # The Secret is produced in-cluster by the sealed-secrets controller
          # from the SealedSecret in Git — the app never sees the ciphertext.
          envFrom:
            - secretRef:
                name: app-secret
          # Guards the boot window: liveness/readiness stay disabled until this
          # first succeeds, so a slow start can never trigger a restart.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12 # up to ~60s to boot before giving up
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
