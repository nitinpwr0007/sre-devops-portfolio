# Day 5 — SLO error budget + multi-window burn-rate alerts
#
# SLO: 99.9% availability  →  error budget = 0.1% (0.001) of requests.
# "Burn rate" = how fast we are spending that budget. Burn rate 1 = spending it
# exactly at the pace that exhausts it over the 30-day window. Burn rate 14.4 =
# burning 14.4x faster (a 30-day budget gone in ~2 days).
#
# We alert on TWO windows at once (short AND long) so we page only when a burn is
# both severe and still happening — this kills false alarms from a brief blip.

groups:
  # ---- Recording rules: precompute the error ratio over each window ----
  # error ratio = 5xx responses / all responses.  If there is no traffic the
  # denominator is 0 → result is absent, so the alerts below simply don't fire.
  - name: slo_error_ratios
    interval: 15s
    rules:
      - record: job:slo_errors:ratio_rate5m
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
            /
          sum(rate(http_requests_total[5m]))

      - record: job:slo_errors:ratio_rate30m
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[30m])) or vector(0))
            /
          sum(rate(http_requests_total[30m]))

      - record: job:slo_errors:ratio_rate1h
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[1h])) or vector(0))
            /
          sum(rate(http_requests_total[1h]))

      - record: job:slo_errors:ratio_rate6h
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[6h])) or vector(0))
            /
          sum(rate(http_requests_total[6h]))

  # ---- Alerting rules: multi-window, multi-burn-rate (Google SRE workbook) ----
  - name: slo_burn_rate_alerts
    rules:
      # FAST burn — pays out the whole 30-day budget in ~2 days.
      # 14.4 * 0.001 = 0.0144 error ratio. Long window 1h + short window 5m.
      - alert: ErrorBudgetBurnFast
        expr: |
          job:slo_errors:ratio_rate1h > (14.4 * 0.001)
            and
          job:slo_errors:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
          slo: availability
          window: fast
        annotations:
          summary: "Fast error-budget burn (14.4x) on availability SLO"
          description: "5xx ratio > 1.44% over 1h AND 5m — the 30-day budget burns out in ~2 days. Page now."

      # SLOW burn — pays out the budget in ~5 days. Long window 6h + short 30m.
      # 6 * 0.001 = 0.006 error ratio.
      - alert: ErrorBudgetBurnSlow
        expr: |
          job:slo_errors:ratio_rate6h > (6 * 0.001)
            and
          job:slo_errors:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels:
          severity: ticket
          slo: availability
          window: slow
        annotations:
          summary: "Slow error-budget burn (6x) on availability SLO"
          description: "5xx ratio > 0.6% over 6h AND 30m — steady erosion of the budget. Open a ticket."
